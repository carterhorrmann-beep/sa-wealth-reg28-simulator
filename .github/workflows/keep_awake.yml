name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake both Streamlit dashboards with headless Chromium
        run: |
          pip install -q playwright
          playwright install chromium
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          domain = "streamlit.app"
          urls = [
              f"https://jse-risk-backtester-5zjcxegbgjxtkappkuj39xk.{domain}/",
              f"https://sa-wealth-reg28-simulator-t9gykeq27yzyjmejcrfgwj.{domain}/",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              for url in urls:
                  page.goto(url, wait_until="networkidle", timeout=60000)
                  if page.get_by_text("Yes, get this app back up!").is_visible():
                      page.get_by_text("Yes, get this app back up!").click()
                      page.wait_for_timeout(15000)
                  print("Visited:", url)
              browser.close()
          EOF
